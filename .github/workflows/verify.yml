name: 独立环境验证

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: retrue_validation
          POSTGRES_USER: retrue_test
          POSTGRES_PASSWORD: validation_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U retrue_test -d retrue_validation"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.settings_test
      RETRUE_TEST_DB_HOST: 127.0.0.1
      RETRUE_TEST_DB_PORT: 5432
      RETRUE_TEST_DB_USER: retrue_test
      RETRUE_TEST_DB_PASSWORD: validation_only
      AI_PROVIDER: mock
      AI_CONFIG_FILE: ""
      LOG_TO_FILE: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            retrue-server/requirements-lock.txt
            retrue-server/requirements-production-lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: retrue-web/package-lock.json
      - name: 安装锁定后端依赖
        working-directory: retrue-server
        run: |
          python -m pip install -r requirements-production-lock.txt
          python -m pip check
      - name: 后端检查和 PostgreSQL 串行回归
        working-directory: retrue-server
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test --noinput --verbosity 1
      - name: 前端干净安装、测试与构建
        working-directory: retrue-web
        run: |
          npm ci
          npm run test
          npm run build
