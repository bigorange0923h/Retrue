# ============================================================
# Retrue AI 多模型配置
#
# 说明：
# - 本文件用于配置多个 AI 模型及故障转移顺序，比 .env 的 JSON 更清晰。
# - 密钥不写在本文件，通过 api_key_env 引用 .env 中的环境变量（如 DEEPSEEK_API_KEY）。
# - provider 按数组顺序依次尝试，单个模型调用失败自动切换到下一个。
#
# 服务商 Base URL：
# - DeepSeek:        https://api.deepseek.com
# - 阿里云百炼 Qwen: https://dashscope.aliyuncs.com/compatible-mode/v1
#
# 启用方式：将 config.enabled 设为 true；或用环境变量 AI_CONFIG_FILE 指定其它文件路径。
# ============================================================

config:
  enabled: false          # 设为 true 启用多模型配置；false 时回退到单 provider（AI_PROVIDER）

providers:
  - name: deepseek-chat
    provider: deepseek
    model: deepseek-chat
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    timeout: 60
    max_tokens: 2000

  - name: qwen-max
    provider: deepseek            # Qwen 走 OpenAI 兼容协议，复用 deepseek provider + base_url
    model: qwen-max
    base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    api_key_env: QWEN_API_KEY
    timeout: 60
    max_tokens: 2000

  - name: mock
    provider: mock                # 兜底，无需密钥
