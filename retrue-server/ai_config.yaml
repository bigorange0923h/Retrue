# ============================================================
# Retrue AI 模型统一配置（主入口）
#
# 用法：
# - 单模型：只保留一个 chat.models 条目即可，系统直接使用该模型。
# - 多模型故障转移：列出多个 chat.models 条目，按顺序尝试，
#   单个模型网络异常时自动切换到下一个。
#
# 说明：
# - 本文件不含密钥；密钥通过 api_key_env 引用 .env 中的独立变量
#   （如 DEEPSEEK_API_KEY、QWEN_API_KEY）。
# - config.enabled 为总开关，设为 true 才启用本配置；
#   false 时回退到 .env 的单 provider（AI_PROVIDER）。
#
# 服务商 Base URL：
# - DeepSeek:        https://api.deepseek.com
# - 阿里云百炼 Qwen: https://dashscope.aliyuncs.com/compatible-mode/v1
# ============================================================

config:
  # 生产环境推荐保持 true：聊天模型统一由本文件管理。
  enabled: true

# 文本向量化（客户私有知识库 RAG），与聊天模型独立。
# 使用阿里云百炼 Qwen text-embedding-v3，维度 1024。
# 密钥通过 api_key_env 引用 .env 的 QWEN_API_KEY。
embeddings:
  provider: qwen
  model: text-embedding-v3
  base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
  api_key_env: QWEN_API_KEY
  timeout: 60

chat:
  # 失败后同一请求立即尝试下一个模型；连续失败到阈值后进入熔断，
  # 熔断期间直接跳过故障模型。窗口结束后自动尝试恢复。
  circuit_breaker:
    failure_threshold: 3
    cooldown_seconds: 300

  # 从上到下依次调用。DeepSeek 与 Qwen 都遵循 OpenAI 兼容协议。
  models:
    - name: deepseek-chat
      provider: openai_compatible
      model: deepseek-chat
      base_url: https://api.deepseek.com
      api_key_env: DEEPSEEK_API_KEY
      timeout: 60
      max_tokens: 2000

    - name: qwen-plus
      provider: openai_compatible
      model: qwen-plus
      base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
      api_key_env: QWEN_API_KEY
      timeout: 60
      max_tokens: 2000

    # 开发与演示环境的最后兜底；生产可按需要删除。
    - name: mock
      provider: mock
